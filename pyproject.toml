[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-rsi"
version = "0.2.0"
description = "Reproducible numerical benchmark and recursive-improvement harness for PDE/FPDE agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
huggingface = ["datasets>=3", "pyarrow>=15", "huggingface_hub>=0.26", "PyYAML>=6"]

[project.scripts]
pde-rsi = "pde_rsi.cli:main"
rsi-pde-bench-eval = "pde_rsi.bench.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
